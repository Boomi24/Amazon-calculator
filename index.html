<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <center>
        <h1>📦 Amazon calculator</h1>
        <h2>Order below $40 : +$10 for delivering fee</h2>
        <h2>Order above $40 : no delivering fee</h2>
        <input id="input-area" type="number" placeholder="Cost Price of a Product" onkeydown="
            if(event.key === 'Enter'){
                calculates();
            }
        ">
        <button id="calculate-btn" onclick="calculates()">Calculate</button>
        <p id="results"></p>
    </center>
    <script src="script.js"></script>
</body>
</html>
